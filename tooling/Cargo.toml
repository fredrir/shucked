[package]
name    = "shucked-tooling"
version = "0.0.2"
edition = "2024"
publish = false

[[bin]]
name = "tooling"
path = "src/main.rs"

[dependencies]
clap       = { version = "4.5", features = ["derive", "cargo", "env"] }
anyhow     = "1"
colored    = "3.0"
rayon      = "1.10"
serde_json = "1"
walkdir    = "2.5"
sha2       = "0.10"
regex      = "1.11"
tar        = "0.4"
flate2     = "1.0"
zstd       = "0.13"
ureq       = { version = "2.12", default-features = false, features = ["tls"] }