[package]
name = "shucked-benchmark"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Benchmark fixtures and harnesses for shucked"
keywords = ["benchmark"]
categories = ["development-tools::profiling"]
publish = false

[package.metadata.cargo-shear]
ignored = ["dhat"]

[features]
large-corpus-hotspots = []
parser-benchmarking = ["shucked-parser/benchmarking"]
dhat-heap = ["dep:dhat"]

[dependencies]
shucked-formatter = { workspace = true, features = ["benchmarking"] }
shucked-linter = { workspace = true, features = ["benchmarking"] }
shucked-parser = { workspace = true }
dhat = { version = "0.3", optional = true }

[target.'cfg(not(target_os = "windows"))'.dependencies]
tikv-jemallocator = "0.6"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
lsp-server = { workspace = true }
lsp-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
shucked-cli = { workspace = true }
shucked-indexer = { workspace = true }
shucked-lsp = { workspace = true }
shucked-semantic = { workspace = true }
similar = { workspace = true }
tempfile = { workspace = true }
walkdir = "2"

[[example]]
name = "parser_counts"
required-features = ["parser-benchmarking"]

[[example]]
name = "large_corpus_profile"
required-features = ["large-corpus-hotspots"]

[[bench]]
name = "lexer"
harness = false

[[bench]]
name = "lexer_hot_path"
harness = false

[[bench]]
name = "parser"
harness = false

[[bench]]
name = "indexer"
harness = false

[[bench]]
name = "arithmetic"
harness = false

[[bench]]
name = "semantic"
harness = false

[[bench]]
name = "editor"
harness = false

[[bench]]
name = "lsp"
harness = false

[[bench]]
name = "unused_assignment"
harness = false

[[bench]]
name = "linter"
harness = false

[[bench]]
name = "formatter"
harness = false

[[bench]]
name = "check_command"
harness = false

[[bench]]
name = "large_corpus_hotspots"
harness = false
required-features = ["large-corpus-hotspots"]

[[bench]]
name = "case_patterns"
harness = false
